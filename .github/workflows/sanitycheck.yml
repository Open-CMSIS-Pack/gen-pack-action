name: Sanity check
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-resolution:
    name: Doxygen version resolution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - run: python -m unittest discover -s tests -v

  pack:
    name: Workflow action
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - uses: ./
        with:
          working-directory: sanity-check
          doxygen-version: auto
          packchk-version: 1.4.1
          gen-doc-script: ./check-doxygen.sh
          doc-path: ./Documentation/html
          gen-pack-script: ./check-pack.sh
          gen-pack-output: ./output
          pack-artifact-format: both

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          verification_failed=0
          if [ ! -f artifacts/Vendor.Pack.1.0.0.pack/Vendor.Pack.1.0.0.pack ]; then
            echo "::error::non-zipped pack artifact not found"
            verification_failed=1
          fi
          if [ ! -f artifacts/pack/Vendor.Pack.1.0.0.pack ]; then
            echo "::error::zipped pack artifact not found"
            verification_failed=1
          fi
          if [ ! -f artifacts/documentation/index.html ]; then
            echo "::error::documentation artifact not found"
            verification_failed=1
          fi
          exit "$verification_failed"
